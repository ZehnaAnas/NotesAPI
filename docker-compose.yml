services:
  web:
    build: .
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: on-failure
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"